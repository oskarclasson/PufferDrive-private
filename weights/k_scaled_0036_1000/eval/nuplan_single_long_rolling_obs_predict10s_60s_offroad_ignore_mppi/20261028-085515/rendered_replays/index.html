
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PufferDrive Replay Gallery</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f3f4f6;
            --surface: #ffffff;
            --surface-muted: #f8f9fb;
            --border: #d7dce2;
            --border-strong: #aeb6c2;
            --text: #1f2933;
            --muted: #667085;
            --accent: #2563eb;
            --offroad: #b45309;
            --collision: #b42318;
            --atfault: #7e22ce;
            --redlight: #d92d20;
            --stopsign: #0e7490;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: var(--background);
            color: var(--text);
            font-family: Arial, system-ui, sans-serif;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .top-header {
            display: grid;
            flex: 0 0 auto;
            grid-template-columns: 170px minmax(0, 1fr) minmax(360px, 450px);
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .brand {
            display: flex;
            grid-column: 1;
            flex-direction: column;
            justify-content: center;
            padding: 8px 18px;
        }

        .brand-kicker {
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 700;
        }

        .brand-link {
            margin-top: 2px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .brand-link:hover { text-decoration: underline; }

        .top-section {
            min-width: 0;
            padding: 8px 12px;
            border-left: 1px solid var(--border);
        }

        .browse-section {
            display: flex;
            align-items: center;
            grid-column: 3;
            width: min(100%, 450px);
            justify-self: end;
        }

        button, select {
            min-height: 36px;
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            color: var(--text);
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:focus-visible, select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.38;
        }

        .filter-dot {
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            border-radius: 1px;
            background: var(--muted);
        }

        .all-dot { background: var(--accent); }
        .offroad-dot { background: var(--offroad); }
        .collision-dot { background: var(--collision); }
        .atfault-dot { background: var(--atfault); }
        .redlight-dot { background: var(--redlight); }
        .stopsign-dot { background: var(--stopsign); }

        select {
            cursor: pointer;
            width: 100%;
            padding: 0 28px 0 10px;
            background: var(--surface);
            font-size: 12px;
            font-weight: 400;
        }

        select:hover { border-color: var(--border-strong); }

        .replay-picker {
            display: flex;
            flex-direction: column;
        }

        #fileSelect {
            width: 100%;
            min-width: 0;
            border-color: var(--border);
            background: var(--surface);
        }

        .browse-controls {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) auto;
            align-items: end;
            gap: 8px;
        }

        .navigation {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
        }

        .nav-button {
            min-height: 30px;
            padding: 0 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
        }

        .nav-button:not(:disabled):hover {
            border-color: var(--accent);
            background: var(--surface-muted);
        }

        #position {
            min-width: 52px;
            color: var(--muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            text-align: center;
        }

        .category-bar {
            display: flex;
            grid-column: 2;
            flex: 0 0 auto;
            min-width: 0;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-left: 1px solid var(--border);
            background: var(--surface);
        }

        .category-filters {
            display: flex;
            min-width: 0;
            flex-wrap: wrap;
            gap: 7px;
        }

        .category-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 34px;
            padding: 0 8px;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
        }

        .category-button:not(:disabled):not(.is-active):hover {
            border-color: var(--border-strong);
            background: var(--surface-muted);
        }

        .category-button.is-active {
            border-color: var(--text);
            background: var(--text);
            color: var(--surface);
        }

        .category-button.is-active .filter-dot {
            outline: 1px solid rgba(255, 255, 255, 0.65);
            outline-offset: 1px;
        }

        .selection-mark {
            display: none;
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
        }

        .category-button.is-active .selection-mark {
            display: inline;
        }

        .category-count {
            display: inline-flex;
            min-width: 21px;
            height: 21px;
            align-items: center;
            justify-content: center;
            padding-inline: 5px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface-muted);
            color: var(--text);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .category-button.is-active .category-count {
            border-color: #647080;
            background: #374151;
            color: var(--surface);
        }

        .replay-stage {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            background: var(--background);
        }

        .scenario-header {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            min-height: 52px;
            margin: 8px 12px 0;
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .scenario-identity {
            min-width: 0;
            flex: 1 1 280px;
        }

        .scenario-eyebrow {
            display: block;
            margin-bottom: 2px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
        }

        #currentReplayName {
            display: block;
            overflow: hidden;
            font-size: 14px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #currentFailures {
            display: flex;
            flex: 0 1 auto;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 5px;
            margin-left: auto;
        }

        .scenario-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 5px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface-muted);
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
        }

        .scenario-badge.offroad {
            border-left: 3px solid var(--offroad);
            color: var(--offroad);
        }

        .scenario-badge.collision {
            border-left: 3px solid var(--collision);
            color: var(--collision);
        }

        .scenario-badge.atfault {
            border-left: 3px solid var(--atfault);
            color: var(--atfault);
        }

        .scenario-badge.redlight {
            border-left: 3px solid var(--redlight);
            color: var(--redlight);
        }

        .scenario-badge.stopsign {
            border-left: 3px solid var(--stopsign);
            color: var(--stopsign);
        }

        #viewer {
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            border: 0;
            background: var(--surface);
        }

        @media (max-width: 1200px) {
            body {
                overflow: auto;
            }

            .app-shell {
                min-height: 100%;
                height: auto;
            }

            .top-header {
                grid-template-columns: 170px minmax(0, 1fr);
            }

            .category-bar {
                grid-column: 2;
            }

            .browse-section {
                grid-column: 1 / -1;
                width: 100%;
                border-top: 1px solid var(--border);
                border-left: 0;
            }

            .category-bar {
                border-left: 1px solid var(--border);
            }

            .replay-stage { min-height: 72vh; }
        }

        @media (max-width: 720px) {
            .top-header { display: flex; flex-direction: column; }
            .brand { padding-block: 16px; }
            .brand-title { font-size: 18px; }
            .top-section { border-top: 1px solid var(--border); border-left: 0; }
            .category-bar { border-top: 1px solid var(--border); border-left: 0; }
            .browse-section { width: 100%; }
            .browse-controls { grid-template-columns: 1fr; }
            .category-bar { padding: 12px; }
            .category-filters { width: 100%; }
            .scenario-header { align-items: flex-start; }
            #currentFailures { margin-left: 0; justify-content: flex-start; }
        }
    </style>
</head>

    <script>
        const select = document.getElementById('fileSelect');
        const viewer = document.getElementById('viewer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const position = document.getElementById('position');
        const currentReplayName = document.getElementById('currentReplayName');
        const currentFailures = document.getElementById('currentFailures');
        const filterButtons = Array.from(document.querySelectorAll('.filter-button'));
        const allOptions = Array.from(select.options);
        let activeFilter = 'all';

        function optionMatchesActiveFilter(option) {
            if (activeFilter === 'all') return true;
            return option.dataset[activeFilter] === 'true';
        }

        function addFailureBadge(label, failureClass) {
            const badge = document.createElement('span');
            badge.className = `scenario-badge ${failureClass}`;
            const dot = document.createElement('span');
            dot.className = `filter-dot ${failureClass}-dot`;
            badge.append(dot, label);
            currentFailures.appendChild(badge);
        }

        function updateScenarioSummary() {
            const selectedOption = select.options[select.selectedIndex];
            currentFailures.replaceChildren();

            if (!selectedOption) {
                currentReplayName.textContent = 'No replay matches this filter';
                return;
            }

            const filename = selectedOption.dataset.name;
            currentReplayName.textContent = filename.replace(/\.html$/, '');
            if (selectedOption.dataset.offroad === 'true') addFailureBadge('Off-road', 'offroad');
            if (selectedOption.dataset.collision === 'true') addFailureBadge('Collision', 'collision');
            if (selectedOption.dataset.atfault === 'true') addFailureBadge('At-fault collision', 'atfault');
            if (selectedOption.dataset.redlight === 'true') addFailureBadge('Red-light violation', 'redlight');
            if (selectedOption.dataset.stopsign === 'true') addFailureBadge('Stop-sign violation', 'stopsign');
            if (!currentFailures.childElementCount) {
                const badge = document.createElement('span');
                badge.className = 'scenario-badge';
                badge.textContent = 'No recorded infraction';
                currentFailures.appendChild(badge);
            }
        }

        function updateControls() {
            const optionCount = select.options.length;
            const selectedIndex = select.selectedIndex;
            prevBtn.disabled = selectedIndex <= 0;
            nextBtn.disabled = selectedIndex < 0 || selectedIndex >= optionCount - 1;
            position.textContent = selectedIndex < 0 ? `0 / ${optionCount}` : `${selectedIndex + 1} / ${optionCount}`;
            updateScenarioSummary();
        }

        function loadSelected() {
            if (select.selectedIndex < 0) {
                viewer.removeAttribute('src');
                updateControls();
                return;
            }
            viewer.src = select.value;
            updateControls();
        }

        function renderOptions(loadReplay) {
            const currentFilename = select.value;
            const matchingOptions = allOptions.filter(optionMatchesActiveFilter);
            select.replaceChildren(...matchingOptions);

            const currentOption = matchingOptions.find(option => option.value === currentFilename);
            if (currentOption) {
                select.value = currentFilename;
            } else {
                select.selectedIndex = matchingOptions.length > 0 ? 0 : -1;
            }

            const selectionChanged = select.value !== currentFilename;
            if (loadReplay && selectionChanged) loadSelected();
            else updateControls();
        }

        function setFilter(filterName) {
            activeFilter = filterName;
            for (const button of filterButtons) {
                const isActive = button.dataset.filter === activeFilter;
                button.classList.toggle('is-active', isActive);
                button.setAttribute('aria-pressed', String(isActive));
            }
            renderOptions(true);
        }

        function navigate(direction) {
            const nextIndex = select.selectedIndex + direction;
            if (nextIndex < 0 || nextIndex >= select.options.length) return;
            select.selectedIndex = nextIndex;
            loadSelected();
        }

        select.addEventListener('change', loadSelected);
        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));
        for (const button of filterButtons) {
            button.addEventListener('click', () => setFilter(button.dataset.filter));
        }
        viewer.addEventListener('load', () => viewer.contentWindow.focus());

        renderOptions(false);
    </script>
